services:
  db:
    image: postgres:15
    container_name: autoria_db_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autoria_redis
    command: sh -c "redis-server --loglevel warning"

  app:
    build: .
    container_name: autoria_app_container
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    container_name: autoria_worker
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DB_HOST=db
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - RQ_REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - ./dumps:/app/dumps
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build: .
    container_name: autoria_scheduler
    environment:
      - PYTHONPATH=/app
    command: rqscheduler --host redis --port 6379 --db 0
    depends_on:
      redis:
        condition: service_started
    env_file: .env

volumes:
  postgres_data:
